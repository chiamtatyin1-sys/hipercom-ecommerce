version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hipercom-db
    environment:
      - POSTGRES_USER=${DB_USER:-hipercom}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Hipercom123#Secure}
      - POSTGRES_DB=${DB_NAME:-hipercom}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - hipercom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hipercom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hipercom-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-hipercom}:${DB_PASSWORD:-Hipercom123#Secure}@db:5432/${DB_NAME:-hipercom}?schema=public
      - JWT_SECRET=${JWT_SECRET:-hipercom_production_secret_key_change_this_2026}
      - MASTER_USERNAME=${MASTER_USERNAME:-hipercom}
      - MASTER_PASSWORD=${MASTER_PASSWORD:-Hipercom123#}
      - HITPAY_API_URL=${HITPAY_API_URL:-https://api.hit-pay.com}
      - HITPAY_API_KEY=${HITPAY_API_KEY}
      - HITPAY_SALT=${HITPAY_SALT}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - EMAIL_HOST=${EMAIL_HOST:-mail.hipercom.com.my}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_SECURE=${EMAIL_SECURE:-true}
      - EMAIL_USER=${EMAIL_USER:-hipercommailserver@hipercom.com.my}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-HiperCom <hipercommailserver@hipercom.com.my>}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    volumes:
      - uploads-data:/app/uploads
      - backups-data:/app/backups
      - logs-data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hipercom-network
    deploy:
      resources:
        limits:
          memory: 1G

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001/api}
    container_name: hipercom-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - hipercom-network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  hipercom-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  uploads-data:
    driver: local
  backups-data:
    driver: local
  logs-data:
    driver: local
